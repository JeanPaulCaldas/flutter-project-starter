name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version from .fvmrc
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate code
        run: dart run build_runner build -d

      # git status also catches generated files that were never committed,
      # which git diff ignores.
      - name: Generated files must be committed and up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are stale or uncommitted:"
            git status --porcelain
            exit 1
          fi

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - run: flutter analyze

      - run: flutter test
