include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: ^3.2.0

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    # This is an app, not a published package.
    public_member_api_docs: false
    # Classic `ClassName(...)` constructors are used everywhere because Freezed
    # redirecting factories cannot use the `new` form.
    unnecessary_type_name_in_constructor: false
